services:
  notebook:
    build: .
    image: movenex-ect:local
    init: true
    restart: unless-stopped
    user: "${ECT_UID:-1000}:${ECT_GID:-1000}"
    ports:
      - "${ECT_BIND_IP:-127.0.0.1}:${ECT_PORT:-8888}:8888"
    environment:
      ECT_DATA_MODE: "${ECT_DATA_MODE:-company}"
      ECT_PRODUCT: "${ECT_PRODUCT:-C10A_49513-75270R}"
      ECT_CSV_PATH: "/workspace/data/private/${ECT_CSV_FILE:-C10A_49513-75270R.csv.gz}"
    volumes:
      - type: bind
        source: "${ECT_CSV_DIR:?Copy .env.example to .env and set ECT_CSV_DIR}"
        target: /workspace/data/private
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${ECT_OUTPUT_DIR:?Set ECT_OUTPUT_DIR in .env}"
        target: /output
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "/opt/ect/docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

